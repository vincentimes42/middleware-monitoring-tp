# =====================================================================
#  Prometheus - TP Monitoring
#
#  GOAL (Step 3): make Prometheus SCRAPE the listings API and store its
#  metrics in the TSDB, so you can build panels and alerts.
#
#  The app (TP1) runs on the SHARED `middleware` network (see
#  ../springboot/docker-compose.yml) as the service/container `listings-api`,
#  listening on port 8080. From inside Prometheus it is reached by network
#  name, so the scrape target is simply:
#      listings-api:8080   -> http://listings-api:8080/actuator/prometheus
#
#  (No host.docker.internal: the app is a container on this network.)
#
#  The config below BOOTS cleanly with only the self-scrape.
#  In STEP 3 you add a **scrape job** for the listings API:
#      - job_name: "listings-api"
#      - metrics_path: "/actuator/prometheus"
#      - targets: ["listings-api:8080"]
#      - labels: service = "listings-api"
# =====================================================================

global:
  scrape_interval: 10s
  evaluation_interval: 10s
  external_labels:
    environment: tp-monitoring

rule_files:
  - "rules.yml"

scrape_configs:
  # self-scrape (keeps Prometheus healthy even before the app is wired)
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # STEP 3 (student): add the listings-api scrape job HERE.
  # Example SHAPE (target the container on the shared network; the `service`
  # label is added HERE, not by the app):
  # - job_name: "listings-api"
  #   metrics_path: "/actuator/prometheus"
  #   static_configs:
  #     - targets: ["listings-api:8080"]
  #       labels:
  #         service: "listings-api"
