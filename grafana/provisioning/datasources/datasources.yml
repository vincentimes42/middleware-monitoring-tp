# =====================================================================
#  Grafana data sources - TP Monitoring
#
#  GOAL (Steps 4 & 5): connect Grafana to the two extra backends so you can
#  build panels and queries against ALL THREE pillars.
#
#  The file below BOOTS with the Prometheus data source pre-created
#  (it is the default, so Step 3's metrics already have a target).
#
#  Each pipeline step adds ITS OWN data source here (or in the Grafana UI):
#      - Step 4 (traces): add Tempo -> type: tempo,  url: http://tempo:3200
#      - Step 5 (logs)  : add Loki  -> type: loki,   url: http://loki:3100
#
#  Each source needs: name, uid, type, access (proxy), url.
#  (Adding them by hand in the Grafana UI - "Add data source" - is equally fine;
#   the panel / dashboard then works the same way.)
# =====================================================================

apiVersion: 1

datasources:
  # Pre-created (default) - metrics target for Step 3.
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      timeInterval: 10s
      httpMethod: POST

  # STEP 4 (student): add the Tempo data source here (or in the Grafana UI), e.g.:
  # - name: Tempo
  #   uid: tempo
  #   type: tempo
  #   access: proxy
  #   url: http://tempo:3200

  # STEP 5 (student): add the Loki data source here (or in the Grafana UI), e.g.:
  # - name: Loki
  #   uid: loki
  #   type: loki
  #   access: proxy
  #   url: http://loki:3100
