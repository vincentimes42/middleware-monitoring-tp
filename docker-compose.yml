# =====================================================================
#  TP Monitoring / Observability — attaches to the SHARED `middleware`
#  network (base: ../springboot/docker-compose.yml, which runs
#  listings-api + listings-postgres). This project adds the three
#  pillars + their front-ends:
#       - prometheus  host 9090   (metrics)   scrapes listings-api:8080
#       - loki        host 3100   (logs)
#       - tempo       host 3200   (traces)
#       - otel-collect host 4317/4318 (receives OTLP from the app)
#       - promtail                 (tails the shared log -> Loki)
#       - grafana     host 3000   (UI over all three)
#
#  How it reaches the app (all over the `middleware` network):
#    * Prometheus   -> scrape target `listings-api:8080` (see
#      ../monitoring/prometheus/prometheus.yml).
#    * App -> Tempo  -> app pushes OTLP gRPC to `otel-collector:4317`
#      (set in the app, see README "Run"). We relay to `tempo:4317`.
#    * App -> Loki   -> app writes /listings-logs/listings.log on the
#      shared volume `middleware-logs`; Promtail tails that same volume.
#    * Services find each other by `container_name`.
#
#  BEFORE YOU RUN: read "Run" in ../monitoring/README.md — it lists the
#  small additions to make in ../springboot/docker-compose.yml (OTLP env
#  + the shared log volume). The exact snippet is at the bottom of this file.
#
#  Run order:
#      $ cd ../springboot && docker compose up -d    # API on 8080, writes log
#      $ cd ../monitoring && docker compose up -d    # the observability stack
#  Health (API) : curl -fsS http://localhost:8080/actuator/health
#  Stack        : curl -fsS http://localhost:9090/-/healthy ; .../3100/ready
# =====================================================================

name: monitoring-tp

networks:
  middleware:
    name: middleware        # SAME global network the base project creates

volumes:
  prom-data:
  loki-data:
  tempo-data:
  promtail-positions:
  grafana-data:
  middleware-logs:
    name: middleware-logs   # shared with the app (see base file snippet)

services:

  # ---------------- Prometheus (metrics) ----------------
  prometheus:
    image: prom/prometheus:v2.53.1
    container_name: mon-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=24h"
      - "--web.enable-lifecycle"
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules.yml:/etc/prometheus/rules.yml:ro
      - prom-data:/prometheus
    extra_hosts:
      # Lets Prometheus reach the host where the Spring Boot app runs (8081)
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 10s
    networks: [middleware]

  # ---------------- Loki (logs) ----------------
  loki:
    image: grafana/loki:2.9.9
    container_name: mon-loki
    command: ["-config.file=/etc/loki/loki-config.yaml"]
    ports:
      - "3100:3100"
    volumes:
      - ./loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki-data:/loki
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3100/ready"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 10s
    networks: [middleware]

  # ---------------- Tempo (traces) ----------------
  tempo:
    image: grafana/tempo:2.6.1
    container_name: mon-tempo
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    ports:
      - "3200:3200"
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3200/ready"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 10s
    networks: [middleware]

  # ---------------- OpenTelemetry Collector (traces pipeline) ----------------
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.108.0
    container_name: mon-otel-collector
    command: ["--config=/etc/otel/collector-config.yaml"]
    ports:
      - "4317:4317"    # OTLP gRPC (the app pushes here, from the network)
      - "4318:4318"    # OTLP HTTP
    volumes:
      - ./otel/collector-config.yaml:/etc/otel/collector-config.yaml:ro
    depends_on:
      tempo:
        condition: service_healthy
    networks: [middleware]

  # ---------------- Promtail (log shipper) ----------------
  promtail:
    image: grafana/promtail:2.9.9
    container_name: mon-promtail
    command:
      - "-config.file=/etc/promtail/config.yml"
      - "-log.level=info"
    volumes:
      # The SAME shared volume the app writes to (see base / README snippet).
      - middleware-logs:/listings-logs:ro
      - ./promtail/promtail-config.yaml:/etc/promtail/config.yml:ro
      - promtail-positions:/positions
    depends_on:
      loki:
        condition: service_healthy
    networks: [middleware]

  # ---------------- Grafana (UI) ----------------
  grafana:
    image: grafana/grafana:11.1.0
    container_name: mon-grafana
    environment:
      # Demo credentials (academic TP - not for production)
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_REPORTING_BACKGROUND_ENABLED: "false"
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      prometheus: { condition: service_healthy }
      loki:       { condition: service_healthy }
      tempo:      { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [middleware]

# =====================================================================
#  REQUIRED EDITS in ../springboot/docker-compose.yml  (see README "Run")
#
#  In the `listings-api` service, add to `environment`:
#      # push OTLP gRPC to the collector over the network name (not localhost)
#      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
#      OTEL_SERVICE_NAME: "listings-api"
#      # write the shared log file that Promtail tails
#      LOG_FILE: "/listings-logs/listings.log"
#
#  and add to `services.listings-api`:
#      volumes:
#        - middleware-logs:/listings-logs
#
#  and declare the shared volume once at the top level of that base file:
#      volumes:
#        middleware-logs:
#          name: middleware-logs
#
#  The API stays published on host 8080 for this TP (Prometheus scrapes
#  listings-api:8080 over the network).
# =====================================================================
