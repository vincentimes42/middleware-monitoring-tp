# =====================================================================
#  Promtail - TP Monitoring
#
#  GOAL (Step 5): make Promtail TAIL the app's log file and SHIP the lines
#  to Loki, labelled so you can query them by `service` and `level`.
#
#  The app (TP1) will write its logs to:  /var/logs/listings.log
#  (see docker-compose: ./logs is bind-mounted to /var/logs in this service).
#  Loki push API:  http://loki:3100/loki/api/v1/push
#
#  The config below BOOTS cleanly (client present + one no-op job). In
#  STEP 5 you add the `listings` job: tail the app file, add `service` and
#  derive `level` from the line.
# =====================================================================

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /positions/positions.yaml

# Ship to Loki (client is present so the service boots; verify it points at Loki).
clients:
  - url: "http://loki:3100/loki/api/v1/push"

scrape_configs:
  # no-op job (always valid) - keep it so the service boots before you add yours
  - job_name: promtail
    static_configs:
      - targets: [localhost]
        labels:
          job: promtail
          __path__: /etc/promtail/config.yml

